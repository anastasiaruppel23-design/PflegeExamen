name: Learning library design checks
on:
  pull_request:
concurrency:
  group: library-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-library-screenshots
          path: test-results/
          retention-days: 7
