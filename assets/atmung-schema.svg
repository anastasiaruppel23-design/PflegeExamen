<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Schema der Atmung</title><desc id="desc">Die Luftröhre teilt sich in zwei Hauptbronchien. In beiden Lungen verzweigen sich die Atemwege. Ein vergrößerter Ausschnitt zeigt Alveolen und den Gasaustausch mit Kapillaren.</desc><rect width="640" height="340" rx="24" fill="#e5f6f5"/><g stroke-linecap="round" stroke-linejoin="round"><path d="M190 36v97m0-12-48 46m48-46 49 46" fill="none" stroke="#16777a" stroke-width="18"/><path d="M164 86C92 73 55 150 58 246c1 32 53 35 105 9V86Zm53 0c72-13 109 64 106 160-1 32-53 35-105 9V86Z" fill="#f4b6ca" stroke="#a5426b" stroke-width="3"/><path d="M190 36v92m0-1-60 54m60-54 60 54m-120 0-28 38m28-38 3 58m117-58 29 38m-29-38-4 58" fill="none" stroke="#16777a" stroke-width="10"/><path d="M57 289q134 33 268 0" fill="none" stroke="#70449a" stroke-width="5"/><path d="m287 187 83-49" stroke="#607c82" stroke-width="2" stroke-dasharray="6 5"/><circle cx="478" cy="155" r="96" fill="#fff" stroke="#8ecbc5" stroke-width="2"/><g fill="#f9d9e4" stroke="#a5426b" stroke-width="2"><circle cx="454" cy="130" r="26"/><circle cx="499" cy="130" r="26"/><circle cx="439" cy="174" r="26"/><circle cx="482" cy="181" r="26"/><circle cx="521" cy="172" r="26"/></g><path d="M410 205q67 51 135-4" fill="none" stroke="#c54c62" stroke-width="9"/><path d="m465 193 0 26m-5-6 5 6 5-6" stroke="#c54c62" fill="none" stroke-width="3"/><path d="m501 223 0-27m-5 6 5-6 5 6" stroke="#177787" fill="none" stroke-width="3"/></g><g font-family="system-ui,sans-serif" fill="#243342" text-anchor="middle"><text x="190" y="321" font-size="16">Lunge · vereinfachtes Schema</text><text x="478" y="41" font-size="17" font-weight="700">Alveolen &amp; Kapillaren</text><text x="455" y="278" font-size="16">O₂ ins Blut</text><text x="503" y="305" font-size="16">CO₂ in die Atemluft</text></g></svg>
