<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">Druckwirkung auf Haut und Gewebe</title><desc id="d">Vereinfachter Hautquerschnitt: Druck wirkt von oben auf Haut, Unterhaut und tiefes Gewebe. Der Kontakt über einem Knochenvorsprung kann tieferes Gewebe belasten.</desc><rect width="640" height="300" rx="24" fill="#fff4cb"/><path d="M70 101q60-12 120 0t120 0 120 0 140 0v33H70Z" fill="#db839f"/><path d="M70 134h500v52H70Z" fill="#f6b5bf"/><path d="M70 186h500v50H70Z" fill="#f5d385"/><path d="M70 236h500v25H70Z" fill="#be8d9b"/><path d="M250 261q70-91 140 0" fill="#fffdf9" stroke="#7a6071" stroke-width="3"/><path d="M320 30v62m-16-17 16 17 16-17" fill="none" stroke="#a12635" stroke-width="7" stroke-linecap="round"/><g font-family="system-ui,sans-serif" fill="#243342" font-size="16"><text x="353" y="58">Druck</text><text x="84" y="125">Oberhaut</text><text x="84" y="167">Lederhaut</text><text x="84" y="219">Unterhaut</text><text x="409" y="281">Knochenvorsprung</text><text x="70" y="30" font-size="13">Vereinfachtes Schema · nicht maßstabsgetreu</text></g></svg>
